name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import runpy; print(runpy.run_path("sdk/version.py")["VERSION"])')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine upload dist/*
