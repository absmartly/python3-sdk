name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import runpy; print(runpy.run_path("sdk/version.py")["VERSION"])')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package version $VERSION (expected v$VERSION)"
            exit 1
          fi

      # PYPIRC_TOKEN is the repository secret earlier releases (up to 0.2.4) were
      # published with: a base64-encoded .pypirc holding the PyPI credentials.
      - name: Build and publish
        env:
          PYPIRC_TOKEN: ${{ secrets.PYPIRC_TOKEN }}
        run: |
          if [ -z "$PYPIRC_TOKEN" ]; then
            echo "::error::The PYPIRC_TOKEN secret is not set"
            exit 1
          fi
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          umask 077
          echo "$PYPIRC_TOKEN" | base64 --decode > "$RUNNER_TEMP/pypirc"
          python -m twine upload --non-interactive --config-file "$RUNNER_TEMP/pypirc" dist/*
